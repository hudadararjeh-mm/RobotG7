<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>الروبوت الذكي (3) – المتغيرات والتعبيرات الشرطية</title>
<style>
:root{--navy:#0a1f52;--navy2:#12307a;--royal:#1f56d8;--sky:#38bdf8;--ice:#e8f1ff;--ink:#0a1f52;--mut:#52648f;--ok:#0f8a4b;--okbg:#dcf7e8;--no:#c2253a;--nobg:#ffe3e7;--warn:#b7791f;--line:#c9d9f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#06143a;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left;background:linear-gradient(160deg,#f4f8ff 0%,#e4eeff 100%);border-radius:0;overflow:hidden;display:flex;flex-direction:column}
.top{height:58px;flex:none;background:linear-gradient(90deg,var(--navy),var(--royal));color:#fff;display:flex;align-items:center;gap:14px;padding:0 26px;font-size:22px}
.top b{flex:1;font-size:23px}
.em{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border-radius:999px;padding:2px 14px;font-size:18px;white-space:nowrap}.eb{width:170px;height:16px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}.eb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee787,#ffd23f);border-radius:99px;transition:width .6s}.em b{flex:none!important;font-size:18px!important;min-width:44px;direction:ltr}#cel{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,31,82,.82);color:#fff;text-align:center;font-size:44px;font-weight:800;line-height:1.5}#cel.on{display:flex;animation:fi .4s}.chip{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 16px;font-size:19px;white-space:nowrap}
.prog{height:6px;background:#cfe0ff;flex:none}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),#fff);transition:width .4s}
#slide{flex:1;padding:14px 30px 12px;overflow-y:auto;overflow-x:hidden;font-size:22px;line-height:1.55;animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{margin:0;font-size:56px;color:var(--navy);line-height:1.15}
h2{margin:0 0 8px;font-size:36px;color:var(--navy)}
h3{margin:6px 0;font-size:25px;color:var(--royal)}
.tag{display:inline-block;background:var(--royal);color:#fff;border-radius:10px;padding:0 14px;font-size:19px;margin-left:8px}
.sub{color:var(--mut);font-size:21px}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 18px;box-shadow:0 6px 18px rgba(18,48,122,.08)}
.card.b{border-color:var(--royal);background:linear-gradient(135deg,#fff,#eef4ff)}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.col3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col21{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:2px solid var(--royal);background:#fff;color:var(--royal);border-radius:14px;padding:4px 18px;font-size:22px;transition:.15s}
.btn:hover:not(:disabled){background:var(--royal);color:#fff}
.btn.p{background:var(--royal);color:#fff}.btn.p:hover:not(:disabled){background:var(--navy)}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{text-align:right;border:2px solid var(--royal);background:#fff;color:var(--ink);border-radius:14px;padding:4px 16px;font-size:21px}
.opt:hover:not(:disabled){background:var(--ice)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#075d31}
.opt.no{background:var(--nobg);border-color:var(--no);color:#8d1627}
.opt.hl{outline:4px solid #f5b301;background:#fff6d0}
.opt:disabled{cursor:default}
.fk{display:none;margin-top:6px;padding:8px 14px;border-radius:12px;font-size:22px}
.fk.ok{display:block;background:var(--okbg);border:2px solid var(--ok);color:#075d31}
.fk.no{display:block;background:var(--nobg);border:2px solid var(--no);color:#8d1627}
.nx{font-size:20px;opacity:.9;margin-top:2px}.deep{margin-top:4px;color:#4b2e83;font-size:21px}
.q{font-weight:700;color:var(--navy);margin-bottom:4px}
.rv{display:none;margin:8px 0;padding:8px 14px;border-radius:14px;font-size:22px}
.rv.show{display:block}
.rv[data-r=h1],.rv[data-r=h2]{background:#fff6d0;border:2px solid #f5b301;color:#6b4b00}
.rv[data-r=ans]{background:var(--okbg);border:2px solid var(--ok);color:#075d31}
.rv[data-r=probe]{background:#ece6ff;border:2px solid #6a45d6;color:#3d2490}.rv.pr{background:none;border:0;padding:0}.pl{display:none;margin:4px 0;padding:6px 14px;border-radius:14px;font-size:21px;border:3px solid}.pl.show{display:block}.pl.p{background:#ffe6f1;border-color:#e8579b;color:#7a1f4a}.pl.b{background:#e1eeff;border-color:#2f80ed;color:#12307a}.pl.y{background:#fff4c2;border-color:#e0a800;color:#5c4300}
.enr,.sup{display:none}
body[data-path=enrich] .enr{display:block}body[data-path=support] .sup{display:block}
.pathbadge{display:none;background:#f5b301;color:#4a3200;border-radius:999px;padding:0 14px;font-size:18px}
body[data-path=enrich] .pathbadge.e{display:inline}body[data-path=support] .pathbadge.s{display:inline}
.enr{border:3px dashed #e0a800;border-radius:16px;padding:8px 14px;background:#fff7cf;margin:8px 0}
.sup{border:3px dashed #e8579b;border-radius:16px;padding:8px 14px;background:#ffe6f1;margin:8px 0}
code,.ltr{direction:ltr;display:inline-block;unicode-bidi:isolate}
code{background:#e3ecff;color:#143d9a;border-radius:8px;padding:0 10px;font-family:Consolas,monospace;font-size:.92em}
input[type=text],input[type=number],select{font:inherit;font-size:22px;padding:3px 10px;border:2px solid var(--royal);border-radius:12px;color:var(--ink);background:#fff;max-width:100%}
input[type=range]{width:100%;accent-color:var(--royal)}
.hx{display:inline-flex;align-items:center;gap:8px;direction:ltr;background:#1a9a62;color:#fff;padding:8px 26px;font-weight:700;font-size:28px;clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%)}
.hx .o{background:#fff;color:var(--navy);border-radius:999px;padding:0 14px;min-width:54px;text-align:center}
.res{display:inline-block;border-radius:999px;padding:0 20px;font-weight:700;font-size:26px;direction:ltr}
.res.t{background:var(--okbg);color:#075d31;border:2px solid var(--ok)}.res.f{background:var(--nobg);color:#8d1627;border:2px solid var(--no)}
.mem{display:inline-block;min-width:260px;background:#fff;border:3px solid var(--royal);border-radius:16px;overflow:hidden;text-align:center;box-shadow:0 5px 14px rgba(31,86,216,.2)}
.mem .h{background:var(--royal);color:#fff;padding:2px 12px;font-size:21px}
.mem .v{font-size:50px;font-weight:800;color:var(--navy);padding:2px 14px;direction:ltr;transition:transform .25s}
.mem .v.pop{transform:scale(1.25);color:var(--royal)}
.mem .t{font-size:18px;background:var(--ice);color:var(--royal);padding:0 10px}
.blk{background:#7a4bd8;color:#fff;border-radius:10px;padding:2px 14px;margin:4px 0;font-size:22px;direction:ltr;text-align:left}
.blk.on{outline:4px solid #f5b301}
.rule{border:2px solid var(--royal);background:#fff;border-radius:16px;padding:6px 14px;color:var(--navy);font-size:22px}
.rule.on{background:var(--navy);color:#fff}
.note{background:var(--ice);border-radius:14px;padding:6px 14px;font-size:22px;margin-top:8px}
.flip{border:2px solid var(--royal);background:#fff;border-radius:16px;padding:6px 10px;font-size:21px;min-height:108px;color:var(--navy)}
.flip.on{background:linear-gradient(135deg,var(--navy2),var(--royal));color:#fff}
.flip small{display:block;color:var(--mut);font-size:17px}.flip.on small{color:#cfe0ff}.flip .en{color:var(--royal)}.flip.on .en{color:#cfe8ff}
.tabs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pane{display:none}.pane.on{display:block}
table{border-collapse:collapse}td,th{border:2px solid var(--line);padding:3px 12px;text-align:center}th{background:var(--ice)}
.timer{font-size:34px;font-weight:800;color:var(--royal);direction:ltr;min-width:96px;display:inline-block;text-align:center}
.timer.low{color:var(--no)}
.closing{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
.slot{width:100%;flex:1;margin-top:14px;border:4px dashed #9db8ee;border-radius:24px;background:rgba(255,255,255,.55);min-height:420px;display:flex;align-items:center;justify-content:center;color:#8aa3d6;font-size:26px}
/* toolbar */
#tb{position:fixed;left:0;right:0;bottom:0;height:70px;background:var(--navy);display:flex;flex-wrap:wrap;gap:5px;align-items:center;align-content:center;padding:2px 10px;z-index:30;direction:rtl}
#tb button{flex:none;background:#1b3d8f;color:#fff;border:1px solid #3a63c4;border-radius:10px;padding:2px 10px;font-size:15px}
#tb button:hover{background:var(--royal)}#tb .sep{width:2px;height:22px;background:#3a63c4;flex:none}
#tb .clock{color:#9fd3ff;font-size:18px;direction:ltr;flex:none;padding:0 8px}
body.hidetb #tb{display:none}
#panel{position:fixed;top:0;bottom:70px;left:0;width:390px;max-width:92vw;background:#fffdf3;border-right:4px solid #f5b301;z-index:40;padding:14px 16px;overflow:auto;font-size:17px;line-height:1.6;display:none;box-shadow:6px 0 20px rgba(0,0,0,.3)}
#panel.on{display:block}#panel .lv{border-radius:10px;padding:3px 8px;margin:3px 0;font-size:15px}#panel .lv.p{background:#ffe6f1}#panel .lv.b{background:#e1eeff}#panel .lv.y{background:#fff4c2}#panel h4{margin:0 0 6px;font-size:20px;color:var(--navy)}#panel p{margin:3px 0 8px}#panel b{color:#6b4b00}
#menu{position:fixed;inset:0 0 70px 0;background:rgba(6,20,58,.94);z-index:50;display:none;padding:20px 30px;overflow:auto}
#menu.on{display:block}#menu h3{color:#fff}
#menu .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
#menu button{background:#fff;border:0;border-radius:12px;padding:8px 12px;text-align:right;font-size:18px;color:var(--navy)}
#menu button.cur{background:var(--sky)}
#gv{position:fixed;inset:0;background:#fff;z-index:60;display:none;overflow:auto;padding:24px 40px;font-size:17px;line-height:1.7}
#gv.on{display:block}#gv h2{font-size:28px}#gv table{width:100%;font-size:15px}#gv td{text-align:right;vertical-align:top}
#gv .bar{position:sticky;top:0;background:#fff;padding:6px 0;display:flex;gap:8px}
@media print{#gv{position:static;overflow:visible}#gv .bar{display:none}body,html{overflow:visible;height:auto}#stage,#tb{display:none}}
</style>
</head>
<body data-path="basic">
<div id="stage"><div class="top"><b id="ttl"></b><div class="em" title="عدّاد الاستدامة"><span>⚡ عدّاد الاستدامة</span><div class="eb"><i id="ef"></i></div><b id="et">0%</b></div><span class="chip" id="mins"></span><span class="chip" id="num"></span></div><div class="prog"><i id="pg"></i></div><section id="slide"></section></div>
<div id="tb"></div><aside id="panel"></aside><div id="menu"></div><div id="gv"></div>
<script>
"use strict";
/* ===== مساحات الغلق (تعبئها المعلمة): الصقي كود HTML داخل علامتي الاقتباس ===== */
const CLOSING={c1:"",c2:"",c3:""};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const TM=[];function clearTM(){TM.splice(0).forEach(clearInterval)}
let cur=0,t0=Date.now(),mcN=0,E=0,eDone=false;
function drawE(){const f=$('#ef'),t=$('#et');if(f){f.style.width=E+'%';t.textContent=E+'%'}}
function addE(n){E=Math.max(0,Math.min(100,E+n));drawE();if(E>=100&&!eDone){eDone=true;let c=$('#cel');if(!c){c=document.createElement('div');c.id='cel';c.onclick=()=>c.classList.remove('on');$('#stage').appendChild(c)}c.innerHTML='<div>🌍⚡<br>وفّرنا الطاقة معًا!<br><span style="font-size:34px;color:#ffd23f">«متعلّم ريادي لتنمية مستدامة»</span></div>';c.classList.add('on');setTimeout(()=>c.classList.remove('on'),4500)}if(E<100)eDone=false}
const MCD={};
function MC(o){const id="m"+(++mcN);MCD[id]=o;return `<div class="mc" id="${id}"><div class="q">${o.q}</div><div class="opts">${o.o.map((t,i)=>`<button class="opt" data-i="${i}">${t}</button>`).join("")}</div><div class="fk"></div></div>`}
function wireMC(root){$$(".mc",root).forEach(m=>{const o=MCD[m.id];let tries=0,done=false;const fk=$(".fk",m);
 $$(".opt",m).forEach(b=>b.onclick=()=>{if(done)return;const i=+b.dataset.i;
  if(i===o.a){done=true;addE(tries===0?5:2);b.classList.add("ok");$$(".opt",m).forEach(x=>x.disabled=true);fk.className="fk ok";fk.innerHTML="✅ "+(o.why||"إجابة سليمة.")+`<div class="nx">🗣️ ${o.ask||"فسّري لزميلتك لماذا اخترتِ هذه الإجابة."}</div>`+(o.deep?`<div class="deep">🟡 تحدٍّ للأصفر: ${o.deep}</div>`:"")}
  else{tries++;b.classList.add("no");b.disabled=true;fk.className="fk no";const h=(o.hs&&o.hs[i])||o.h1;
   fk.innerHTML=tries<2?`🤔 تلميح: ${h}<div class="nx">فكّري ثم حاولي مرة ثانية.</div>`:`💡 ${h}<div class="nx">🩷 للوردي · مسار دعم: ${o.sup||"ارجعي إلى شرح المفهوم ثم أعيدي المحاولة مع زميلتك."}</div>`}})})}
function countdown(el,sec,btn,done){let s=sec,id=null;const draw=()=>{el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");el.classList.toggle("low",s<=10&&s>0)};draw();
 btn.onclick=()=>{if(id){clearInterval(id);id=null;s=sec;draw();btn.textContent="▶ ابدئي";return}btn.textContent="⏹ إيقاف";id=setInterval(()=>{s--;draw();if(s<=0){clearInterval(id);id=null;btn.textContent="↺ من جديد";done&&done()}},1000);TM.push(id)}}
function picker(root,max,label){const b=$(".pk",root),o=$(".pko",root);if(!b)return;b.onclick=()=>{let n=0;const id=setInterval(()=>{o.textContent="🎲 "+label+" "+(1+Math.floor(Math.random()*max));if(++n>12){clearInterval(id);o.textContent="🎤 "+label+" "+(1+Math.floor(Math.random()*max))}},70);TM.push(id)}}
function tabs(root){const bs=$$(".tabs .btn",root),ps=$$(".pane",root);bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.classList.remove("on"));ps.forEach(x=>x.classList.remove("on"));b.classList.add("on");ps[i].classList.add("on")});bs[0]&&bs[0].click()}
function memBox(name,val,type){return `<div class="mem"><div class="h">${name}</div><div class="v">${val}</div><div class="t">${type}</div></div>`}
function pop(el){el.classList.add("pop");setTimeout(()=>el.classList.remove("pop"),260)}
function RV(kind,html){return `<div class="rv" data-r="${kind}">${html}</div>`}
const CMP={"<":(a,b)=>a<b,"=":(a,b)=>a===b,">":(a,b)=>a>b};
const TF=v=>v?"True":"False";
function school(sun){const n=Math.round((100-sun)/100*6);let l="";for(let i=0;i<6;i++){const on=i<n;l+=`<g transform="translate(${70+i*82},96)"><line x1="0" y1="-30" x2="0" y2="-8" stroke="#5b6b94" stroke-width="3"/><circle r="17" fill="${on?"#ffd23f":"#cdd6ea"}" stroke="#7f8fb5" stroke-width="3"/>${on?'<circle r="27" fill="#ffd23f" opacity=".28"/>':""}</g>`}
 return `<svg viewBox="0 0 560 250" width="100%" style="border-radius:16px;border:2px solid #c9d9f5"><rect width="560" height="250" fill="#dbe9ff"/><rect x="0" y="150" width="560" height="100" fill="#b8c9ea"/><rect x="0" y="40" width="560" height="110" fill="#f4f8ff"/><rect x="0" y="40" width="560" height="10" fill="#12307a"/>${l}<g transform="translate(470,30)"><circle cx="0" cy="0" r="${14+sun/8}" fill="#ffb703" opacity="${.25+sun/140}"/></g><rect x="40" y="165" width="480" height="8" rx="4" fill="#9fb3dd"/><text x="280" y="215" text-anchor="middle" font-size="20" fill="#12307a">ممر المدرسة</text><text x="548" y="26" text-anchor="start" direction="rtl" font-size="18" fill="#12307a">☀ ضوء الشمس: ${sun}</text><text x="12" y="26" text-anchor="end" direction="rtl" font-size="18" fill="#12307a">الأضواء المضاءة: ${n}</text></svg>`}
function lampSvg(on){return `<svg viewBox="0 0 160 170" width="170"><path d="M80 18a46 46 0 0 0-26 84v16h52v-16a46 46 0 0 0-26-84z" fill="${on?"#ffd23f":"#d9e0f1"}" stroke="#5b6b94" stroke-width="5"/>${on?'<circle cx="80" cy="64" r="64" fill="#ffd23f" opacity=".25"/>':""}<rect x="58" y="120" width="44" height="12" rx="5" fill="#5b6b94"/><rect x="64" y="136" width="32" height="10" rx="5" fill="#5b6b94"/></svg>`}
/* ===== الشرائح ===== */
const SL=[];
function add(o){SL.push(o)}
/* 1 الرئيسية */
add({k:"home",t:"الصفحة الرئيسية وقواعد الحصة",min:0,back:"home",
g:{p:"ترحيب وتأسيس بيئة آمنة وداعمة، وتأطير مهمة الدرس.",s:"قواعد صفية بتمثيل سلوك متوقع (نماذج مواقف) بدل التلقين.",q:"ما الذي يساعدنا أن نتعلم أفضل اليوم؟ ماذا تعني قاعدة «نتعلم من الخطأ»؟",e:"يذكرن سلوكيات: الانتظار، التجربة، المساعدة بتلميح.",pr:"كيف نشعر زميلتنا بالأمان عندما تخطئ؟",f:"أثني على السلوك المحدد (مثل: لاحظتُ أنكِ انتظرتِ زميلتك).",i:"3.1، 3.3"},
html:()=>`<div style="display:flex;gap:30px;align-items:center;margin-top:6px"><div style="font-size:110px">🤖</div><div><div class="sub">الحوسبة وتكنولوجيا المعلومات · الروبوت الذكي (3)</div><h1>المتغيرات والتعبيرات الشرطية</h1><p style="margin:6px 0 0;font-size:28px;color:var(--royal)">مهمتنا اليوم: نصمّم «عقلًا» لروبوت يوفّر الطاقة في مدرستنا ⚡</p><div class="chip" style="background:var(--navy);color:#fff;margin-top:8px;display:inline-block">🇶🇦 رؤيتنا: متعلّم ريادي لتنمية مستدامة</div><div class="chip" style="background:#fff;color:var(--navy);border:2px solid var(--line);margin:8px 0 0 8px;display:inline-block">ألوان أسئلتنا حسب ستيكر كتابك: 🩷 · 🔵 · 🟡</div></div></div>
<h3 style="margin-top:26px">قواعدنا في هذه الحصة <span class="sub">(اضغطي على قاعدة لنرى كيف تبدو في صفنا)</span></h3>
<div class="row" id="rules">${[["🤝","نحترم جميع الإجابات","نقول: «فهمتُ فكرتك، وأريد أن أضيف…»"],["👂","نستمع دون مقاطعة","ننتظر حتى تُنهي زميلتنا جملتها ثم نبدأ"],["🙋","نشارك بثقة","نجرّب الإجابة ولو لم نكن متأكدات، فالتجربة بداية التعلم"],["🤲","نتعاون وندعم زميلاتنا","نساعد بتلميح يقود للتفكير، لا بإجابة جاهزة"],["🌱","نتعلم من الخطأ","الخطأ يخبرنا ما الذي نحتاج أن نفهمه أكثر"]].map((r,i)=>`<button class="rule" data-i="${i}" data-t="${r[2]}">${r[0]} ${r[1]}</button>`).join("")}</div>
<div class="note" id="rt" style="font-size:25px;min-height:50px">اضغطي على قاعدة 👆</div>`,
init:e=>{$$(".rule",e).forEach(b=>b.onclick=()=>{$$(".rule",e).forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#rt",e).textContent=b.dataset.t})}});

html:()=>`<h2>📘 مصطلحات الدرس</h2><div class="sub">سمّي ما تمثّله الصورة بالعربية والإنجليزية، ثم اضغطي على البطاقة لتري المعنى.</div><div class="col3" style="grid-template-columns:repeat(5,1fr);margin-top:6px" id="tg"></div><div class="card" id="tm2" style="margin-top:8px;min-height:60px;font-size:23px">اضغطي على بطاقة 👆</div><div class="card" style="margin-top:8px"><button class="btn p pk">🎲 اختاري طالبة</button> <b class="pko"></b> <span class="sub">لتسمّي مصطلحًا بلغتين ثم تستخدمه في جملة</span></div>`,
init:e=>{const T=[["متغير","Variable","var","موقع في ذاكرة الحاسوب لتخزين البيانات، له اسم ونوع وقيمة."],["عددي","Numeric","num","متغير يخزّن أرقامًا."],["نصي","Text","txt","متغير يخزّن كلمات."],["منطقي","Logic","bool","متغير يخزّن «صح» أو «خطأ»."],["تعبير شرطي","Conditional Expression","cond","مفهوم برمجي لاتخاذ القرار بناءً على شرط."],["صح / خطأ","True / False","tf","نتيجة التعبير الشرطي."],["أصغر من","Less Than","lt","True إذا كانت اليسرى أصغر من اليمنى."],["المساواة","Equal","eq","True إذا تساوت القيمتان."],["أكبر من","Greater Than","gt","True إذا كانت اليسرى أكبر من اليمنى."],["الشرط والنتيجة","Condition & Result","cr","الشرط ما نفحصه، والنتيجة ما يحدث إذا تحقق."]];
 const g=$("#tg",e);g.innerHTML=T.map((x,i)=>`<button class="flip" data-i="${i}" style="text-align:center"><svg viewBox="0 0 100 70" width="100%" height="74">${IC[x[2]]}</svg><b>${x[0]}</b><small class="en" style="direction:ltr;font-size:17px">${x[1]}</small></button>`).join("");
 $$(".flip",g).forEach(b=>b.onclick=()=>{$$(".flip",g).forEach(x=>x.classList.remove("on"));b.classList.add("on");const x=T[+b.dataset.i];$("#tm2",e).innerHTML=`<b>${x[0]} · <span class="ltr">${x[1]}</span>:</b> ${x[3]}`});picker(e,30,"الطالبة رقم")}});

g:{p:"تهيئة محسوسة للهدف الأول: وعاء شفاف وكرات تنس تمثّل قيمة تتغيّر قبل تسمية المفهوم.",s:"نشاط محسوس ثم جسر إلى ذاكرة الروبوت (من المحسوس إلى المجرّد) + توقّع–لاحظ–فسّر.",q:"كم كرة في الوعاء الآن؟ ما الذي تغيّر؟ وما الذي بقي كما هو؟",e:"عدد الكرات تغيّر، أما الوعاء واسمه فبقيا؛ الوعاء مكان يحتفظ بقيمة.",pr:"",f:"اطلبي من الطالبة أن تتتبّع الخطوات بالتسلسل، ثم أعيدي السؤال بتلميح.",i:"2.1، 2.5، 2.6، 1.5"},
html:()=>`<h2>🥣 نشاط الوعاء والكرات</h2><div class="col2"><div><div class="card b"><b>🧑‍🏫 تنفّذ المعلمة بالوعاء الحقيقي:</b><ol style="margin:4px 0;padding-right:22px;font-size:21px"><li>أضع كرة في الوعاء: كم كرة الآن؟</li><li>أضيف كرة ثانية ثم ثالثة: وكم الآن؟</li><li>أُخرج كرة: وماذا حدث للعدد؟</li><li>أُفرغ الوعاء وأضع 5 كرات معًا.</li></ol></div>
<div style="text-align:center;margin-top:8px"><div class="sub">مرآة الشاشة: ذاكرة الروبوت</div><div id="mb">${memBox("عدد_الكرات","0","عددي")}</div><div class="row" style="justify-content:center;margin-top:6px"><button class="btn" data-op="+">➕ كرة</button><button class="btn" data-op="-">➖ كرة</button><button class="btn" data-op="=">= 5</button><button class="btn" data-op="0">↺ 0</button></div></div></div>
<div>${MC({q:"كان في الوعاء 3 كرات، فأضفنا كرتين ثم أخرجنا كرة. كم كرة الآن؟",o:["4","5","6","2"],a:0,hs:{1:"3 + 2 = 5، لكنكِ نسيتِ إخراج الكرة.",2:"هل إخراج كرة يزيد العدد أم ينقصه؟",3:"ابدئي من 3 ثم تتبّعي كل خطوة."},h1:"تتبّعي القيمة خطوة بعد خطوة.",why:"3 ثم 5 بعد الإضافة ثم 4 بعد الإخراج.",ask:"اشرحي لزميلتك كيف تتبّعتِ العدد.",deep:"ماذا يحدث لو وضعنا 10 كرات معًا بدل الإضافة؟"})}
${RV("ans","✅ الوعاء <b>مكان يحتفظ بقيمة</b> وله اسم؛ والقيمة (عدد الكرات) <b>تتغيّر</b> ويبقى الوعاء كما هو. هكذا يحتفظ الروبوت بالأرقام في ذاكرته: نسميه <b>متغيرًا</b>.")}
<div class="card b" style="margin-top:8px"><b>✍️ استنتاجك المستقل (30 ث):</b> ما وجه الشبه بين الوعاء وذاكرة الروبوت؟ ثم ناقشي زميلتك.<div class="row"><button class="btn" id="tp">⏱ ابدئي</button><span class="timer" id="tmr">00:30</span></div></div></div></div>`,
init:e=>{wireMC(e);countdown($("#tmr",e),30,$("#tp",e));let v=0;const mb=$("#mb",e);$$("[data-op]",e).forEach(b=>b.onclick=()=>{const o=b.dataset.op;v=o==="+"?v+1:o==="-"?Math.max(0,v-1):o==="="?5:0;mb.innerHTML=memBox("عدد_الكرات",v,"عددي");pop($(".v",mb))})}});

add({k:"g1explain",t:"الهدف 1 · ما المتغير؟",min:2,back:"g1explore",
g:{p:"بناء مفهوم المتغير (اسم، نوع، قيمة) وربطه بلبنة Variable في LEGO SPIKE.",s:"نمذجة تفاعلية: تُنشئ الطالبة متغيرًا وتُغيّر قيمته وتلاحظ المطابقة بين النوع والقيمة.",q:"ما الذي بقي ثابتًا وما الذي تغيّر عندما غيّرنا القيمة؟",e:"الاسم والنوع ثابتان، والقيمة تتغيّر.",pr:"لماذا رفض البرنامج القيمة «خطأ» لمتغير عددي؟",f:"فسّري خطأ المطابقة بين النوع والقيمة بلغة الطالبة نفسها.",i:"2.2، 2.3، 1.2"},
html:()=>`<h2>📦 لبنة المتغير Variable</h2><div class="col21"><div><div class="card b" style="font-size:23px"><b>المتغير:</b> موقع في ذاكرة الحاسوب يُستخدم لتخزين البيانات، ولكل متغير <b>اسم</b> و<b>نوع</b> و<b>قيمة</b>.<br>🧩 في SPIKE: من لوحة <b>Variables (المتغيرات)</b> نختار إنشاء متغير <span class="ltr">(Make a Variable)</span>. في المنهج: متغير <b>عددي</b> للسرعة بقيمة ابتدائية <b>0</b>.</div>
<div class="card" style="margin-top:10px"><b>أنشئي متغيرًا:</b><div class="row">الاسم <select id="vn"><option>السرعة</option><option>اسم_الروبوت</option><option>البطارية_ممتلئة</option></select> النوع <select id="vt"><option>عددي</option><option>نصي</option><option>منطقي</option></select> القيمة <input type="text" id="vv" value="0" size="8"> <button class="btn p" id="mk">إنشاء</button></div><div id="er" class="fk"></div></div></div>
<div style="text-align:center"><div class="sub">ذاكرة الروبوت</div><div id="mb" style="min-height:140px">${memBox("—","—","—")}</div><div id="ch" style="display:none;margin-top:8px" class="card">غيّري القيمة: <input type="text" id="nv" size="8"> <button class="btn" id="cv">تغيير</button></div>
${RV("probe","❓ ماذا تغيّر بعد تغيير القيمة؟ وماذا بقي كما هو؟ ولماذا؟")}${RV("ans","✅ تغيّرت <b>القيمة</b> فقط، وبقي <b>الاسم</b> و<b>النوع</b>. أنواع المتغيرات: عددي Numeric · نصي Text · منطقي Logic.")}</div></div>`,
init:e=>{let T="عددي";const ok=(t,v)=>t==="عددي"?/^-?\d+(\.\d+)?$/.test(v):t==="منطقي"?["صح","خطأ","True","False"].includes(v):v.length>0;
 const er=$("#er",e);const msg=(t,v)=>t==="عددي"?"المتغير العددي يخزّن أرقامًا فقط. هل «"+v+"» رقم؟ غيّري القيمة أو النوع.":t==="منطقي"?"المنطقي يحمل «صح» أو «خطأ» فقط. جرّبي ذلك.":"اكتبي كلمة أو عبارة.";
 $("#vt",e).onchange=()=>{const t=$("#vt",e).value;$("#vv",e).value=t==="عددي"?"0":t==="نصي"?"سبايك":"صح"};

function chime(notes){if(!snd)return;try{const a=new(window.AudioContext||window.webkitAudioContext)();notes.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.16;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.03);g.gain.exponentialRampToValueAtTime(.0008,t+1.1);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+1.2)});setTimeout(()=>a.close(),2000)}catch(e){}}

function build(){q("#gsay").textContent="اكشطي بطاقة بإصبعك وشوفي حظّك ✨";const L=shuffle(items.slice(0,10));const grid=q("#gsg");grid.innerHTML="";L.forEach(v=>{const t=v.trim(),empty=/^(فارغ|فاضي|)$/.test(t),luck=/حظ/.test(t),clp=/تصفيق/.test(t),gift=!(empty||luck||clp);
 const d=document.createElement("div");d.className="sc"+(gift?" gf":"");const txt=empty?"🥀 فارغ":luck?"🌱 حظ أوفر":clp?"🍃 تصفيق 👏":"🎁 "+t;d.innerHTML='<div class="in">'+txt+'</div>';
